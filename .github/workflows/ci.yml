name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: nfd-proxy
          path: target/nfd-proxy.jar
