name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check tag matches pom version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pom version ${version}" >&2
            exit 1
          fi

      - name: Build and test
        run: mvn -B clean verify

      - name: Package
        run: |
          mkdir -p dist/nfd-proxy-server
          cp target/nfd-proxy.jar src/main/resources/app.yml dist/nfd-proxy-server/
          cd dist
          zip -r -X nfd-proxy-server.zip nfd-proxy-server
          cp nfd-proxy-server/nfd-proxy.jar nfd-proxy.jar
          sha256sum nfd-proxy-server.zip nfd-proxy.jar > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md \
            dist/nfd-proxy-server.zip dist/nfd-proxy.jar dist/SHA256SUMS
